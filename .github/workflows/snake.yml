name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: febfrmn
          outputs: |
            dist/snake.svg?color_snake=F97316&color_dots=0EA5E9,F97316,0d1117

      - name: Fix CSS var colors (snk strips #, dist read-only)
        run: |
          mkdir -p out
          cp dist/snake.svg out/snake.svg
          sed -E 's/(--c[0-9a-z]+):([0-9a-fA-F]{6})/\1:#\2/g' out/snake.svg > out/snake_fixed.svg
          mv out/snake_fixed.svg out/snake.svg
          grep -oE '\-\-[a-z0-9]+:[^;]+' out/snake.svg | sort -u

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: output
