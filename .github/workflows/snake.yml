name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: febfrmn
          outputs: |
            dist/snake.svg?color_snake=F97316&color_dots=0EA5E9,F97316,0d1117

      - name: Fix CSS var colors (snk strips #)
        run: |
          sed -E -i 's/(--c[0-9a-z]+):([0-9a-fA-F]{6})/\1:#\2/g' dist/snake.svg
          grep -oE '\-\-[a-z0-9]+:[^;]+' dist/snake.svg | sort -u

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
